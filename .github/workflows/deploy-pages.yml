name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions minimales pour publier sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement Pages à la fois (pas d'annulation en cours de route)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # sitemap-lastmod.py interroge `git log` : il lui faut l'historique.
          # blob:none évite de rapatrier les ~130 Mo de blobs (uploads/) au
          # passage : commits et arbres suffisent à dater un fichier.
          fetch-depth: 0
          filter: blob:none

      # ⚠ Épinglé plutôt que de s'en remettre au Node par défaut du runner : une
      # dépendance implicite change sous vos pieds à la faveur d'une mise à jour d'image,
      # et l'on découvre la panne au moment d'un déploiement.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # 🔴 BARRIÈRE AVANT PUBLICATION. L'espace fondateur est un composant à gabarit
      # maison : une clé `{{ … }}` absente de `renderVals()` ne lève AUCUNE erreur, la
      # zone reste simplement VIDE. Une coquille se déploierait donc sans un signe, sur la
      # page qui sert précisément à surveiller le produit. Le vérificateur exécute le
      # composant et confronte gabarit et valeurs rendues, dans les deux sens.
      # ⚠ Placé AVANT l'upload : un tableau de bord amputé ne doit pas atteindre Pages.
      - name: Vérifier l'espace fondateur
        run: node scripts/check-espace-fondateur.mjs

      - name: Rafraîchir les lastmod du sitemap
        run: python3 scripts/sitemap-lastmod.py

      # 🔒 Le paquet Pages part avec TOUT le dépôt (path: . ci-dessous) : un fichier
      # présent ici est téléchargeable sur redibat.fr, qu'une page y renvoie ou non.
      # Ces trois dossiers n'ont rien à faire sur le web — et .githooks/pre-commit y
      # nommait en clair les mots de passe qu'il sert à bloquer.
      # ⚠ APRÈS les deux étapes ci-dessus, qui exécutent scripts/. Le checkout est
      # jetable : on supprime dans le runner, pas dans le dépôt.
      - name: Retirer du paquet ce qui n'est pas le site
        run: rm -rf .githooks scripts design-system

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Publie tout le dépôt tel quel (site statique). CNAME est inclus
          # d'office ; .nojekyll ne l'est PAS depuis la v4, qui exclut les
          # fichiers cachés. Sans lui, Jekyll ignorerait _ds/ (préfixe _) et
          # le site perdrait tout son CSS. .git et .github restent exclus
          # même avec l'option activée.
          path: .
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
