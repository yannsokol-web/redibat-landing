name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions minimales pour publier sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement Pages à la fois (pas d'annulation en cours de route)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # sitemap-lastmod.py interroge `git log` : il lui faut l'historique.
          # blob:none évite de rapatrier les ~130 Mo de blobs (uploads/) au
          # passage : commits et arbres suffisent à dater un fichier.
          fetch-depth: 0
          filter: blob:none

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Rafraîchir les lastmod du sitemap
        run: python3 scripts/sitemap-lastmod.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Publie tout le dépôt tel quel (site statique). CNAME est inclus
          # d'office ; .nojekyll ne l'est PAS depuis la v4, qui exclut les
          # fichiers cachés. Sans lui, Jekyll ignorerait _ds/ (préfixe _) et
          # le site perdrait tout son CSS. .git et .github restent exclus
          # même avec l'option activée.
          path: .
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
