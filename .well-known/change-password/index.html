<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Adresse normalisée « changement de mot de passe » (W3C Well-Known URL for Changing
     Passwords) : les gestionnaires de mots de passe (Chrome, Safari, 1Password, Bitwarden…)
     y envoient l'utilisateur quand ils proposent de remplacer un mot de passe faible ou
     compromis. Le site est statique : simple renvoi vers la carte « Mot de passe » du profil
     (la page de connexion prend le relais si la session n'est pas ouverte). -->
<meta http-equiv="refresh" content="0; url=/communaute/profil">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changer de mot de passe | Rédibat</title>
</head>
<body>
<p>Redirection vers <a href="/communaute/profil">votre profil</a> pour changer de mot de passe. Mot de passe oublié ? <a href="/mot-de-passe-oublie">Demandez un lien de réinitialisation</a>.</p>
</body>
</html>
