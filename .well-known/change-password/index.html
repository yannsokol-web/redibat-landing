<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Adresse normalisée « changement de mot de passe » (W3C Well-Known URL for Changing
     Passwords) : les gestionnaires de mots de passe (Chrome, Safari, 1Password, Bitwarden…)
     y envoient l'utilisateur quand ils proposent de remplacer un mot de passe faible ou
     compromis. Le site est statique : simple renvoi vers la page qui permet de définir un
     nouveau mot de passe (lien reçu par e-mail). -->
<meta http-equiv="refresh" content="0; url=/mot-de-passe-oublie">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changer de mot de passe | Rédibat</title>
</head>
<body>
<p>Redirection vers la page de <a href="/mot-de-passe-oublie">réinitialisation du mot de passe</a>.</p>
</body>
</html>
