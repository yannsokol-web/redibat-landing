</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/r-dibat-design-system-740ba38c-581d-4335-88dd-fcf28913eed8/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/r-dibat-design-system-740ba38c-581d-4335-88dd-fcf28913eed8/tokens/colors.css">
  <link rel="stylesheet" href="_ds/r-dibat-design-system-740ba38c-581d-4335-88dd-fcf28913eed8/tokens/typography.css">
  <link rel="stylesheet" href="_ds/r-dibat-design-system-740ba38c-581d-4335-88dd-fcf28913eed8/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/r-dibat-design-system-740ba38c-581d-4335-88dd-fcf28913eed8/styles.css">
  <script src="_ds/r-dibat-design-system-740ba38c-581d-4335-88dd-fcf28913eed8/_ds_bundle.js"></script>
  <style>html, body { margin: 0; background: #ffffff; }</style>
</helmet>

<div style="position: relative; min-height: 100vh; background: #ffffff; font-family: 'Hanken Grotesk', system-ui, sans-serif; overflow-x: clip;">

  <div aria-hidden="true" style="position: fixed; inset: 0; z-index: 0; pointer-events: none;
       background: radial-gradient(1100px 620px at 82% -10%, rgba(48, 197, 236, 0.10), transparent 60%), radial-gradient(1000px 720px at 4% 2%, rgba(24, 95, 203, 0.07), transparent 62%), #ffffff;"></div>
  <div aria-hidden="true" style="position: fixed; inset: 0; z-index: 0; pointer-events: none;
       background-image: linear-gradient(rgba(31, 58, 92, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(31, 58, 92, 0.05) 1px, transparent 1px);
       background-size: 58px 58px; -webkit-mask-image: radial-gradient(120% 100% at 50% 0%, #000 35%, transparent 80%); mask-image: radial-gradient(120% 100% at 50% 0%, #000 35%, transparent 80%);"></div>

  <dc-import name="Header" style="position: sticky; top: 0; z-index: 50;" hint-size="100%,66px"></dc-import>

  <main style="position: relative; z-index: 2;">
    <section style="max-width: 840px; margin: 0 auto; padding: 72px 32px 110px;">
      <div style="text-align: center; margin-bottom: 52px;">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--a-blue); margin-bottom: 18px;">FAQ</div>
        <h1 style="font-family: 'Newsreader', Georgia, serif; font-weight: 500; letter-spacing: -0.025em; line-height: 1.08; font-size: clamp(34px, 4.6vw, 52px); color: #16314f; margin: 0;">Questions <em style="font-style: italic; font-weight: 500; display: inline-block; padding-right: 0.09em; background: linear-gradient(100deg, #185fcb, #30c5ec) text; -webkit-text-fill-color: transparent; color: transparent;">fréquentes</em></h1>
      </div>

      <div style="border-top: 1px solid var(--a-border);">
        <sc-for list="{{ faqs }}" as="item" hint-placeholder-count="7">
          <div style="border-bottom: 1px solid var(--a-border);">
            <button type="button" onClick="{{ item.onToggle }}"
                 style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 24px;
                        background: none; border: none; cursor: pointer; text-align: left; padding: 24px 6px;
                        font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 17.5px; font-weight: 600; color: #16314f;
                        transition: color .18s ease;" style-hover="color: var(--a-blue);">
              <span>{{ item.q }}</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                   style="flex: none; color: var(--a-blue); transition: transform .28s cubic-bezier(0.2,0.8,0.2,1); transform: {{ item.caret }};">
                <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
            <sc-if value="{{ item.open }}" hint-placeholder-val="{{ false }}">
              <div style="padding: 0 6px 26px; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15.5px; line-height: 1.68;
                          color: var(--a-text); max-width: 720px; text-wrap: pretty;">{{ item.a }}</div>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <div style="margin-top: 48px; text-align: center;">
        <a href="mailto:contact@redibat.fr" style="display: inline-flex; align-items: center; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #ffffff; background: linear-gradient(135deg, #0b317c 0%, #185fcb 55%, #30c5ec 100%); padding: 14px 30px; border-radius: 100px; box-shadow: 0 10px 26px -10px rgba(24,95,203,0.6); transition: transform .18s ease, filter .18s ease;" style-hover="transform: translateY(-1px); filter: brightness(1.06);">Une autre question ? Contactez-nous</a>
      </div>
    </section>
  </main>

  <dc-import name="Footer" hint-size="100%,440px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { openFaq: 0 };
  toggleFaq = (i) => this.setState(s => ({ openFaq: s.openFaq === i ? null : i }));
  renderVals() {
    const faqData = [
      { q: "Qu'est-ce qu'un logiciel de rédaction de CCTP ?", a: "Un logiciel de rédaction de CCTP aide les professionnels du bâtiment à structurer et rédiger leurs cahiers des clauses techniques particulières, par lots et par articles, puis à les exporter en Word ou PDF. Rédibat va plus loin en vous laissant capitaliser vos propres articles types dans une bibliothèque réutilisable d'un projet à l'autre." },
      { q: "À qui s'adresse Rédibat ?", a: "Aux maîtres d'œuvre, maîtres d'ouvrage (MOE/MOA), économistes de la construction, architectes et bureaux d'études qui rédigent régulièrement des pièces écrites : CCTP, descriptifs et DPGF." },
      { q: "Puis-je repartir de mes CCTP existants ?", a: "Oui. Rédibat importe vos documents existants pour repartir de votre travail plutôt que d'une page blanche, et alimenter votre bibliothèque avec vos propres contenus." },
      { q: "Mes données restent-elles en local ? Faut-il une connexion Internet permanente ?", a: "Vos affaires sont enregistrées en local, dans un format ouvert, et l'application fonctionne sans connexion permanente. Vous gardez la main sur vos données, sans dépendre du cloud d'un éditeur." },
      { q: "Comment fonctionne la bibliothèque d'articles types ?", a: "Vous capitalisez vos propres articles types au fil des projets et les réutilisez d'une affaire à l'autre. Votre bibliothèque vous appartient et s'enrichit à chaque CCTP rédigé, au lieu de louer une base imposée." },
      { q: "Rédibat couvre-t-il la DPGF, l'ouverture des plis, le TCO et le RAO ?", a: "Oui. À partir de vos descriptifs, Rédibat génère la décomposition de prix (DPGF), puis vous accompagne sur l'ouverture des plis, le tableau comparatif des offres (TCO) et le rapport d'analyse des offres (RAO)." },
      { q: "En quoi Rédibat se distingue des logiciels de CCTP en ligne ?", a: "Là où beaucoup d'outils sont 100 % en ligne et reposent sur une bibliothèque louée, Rédibat est une application de bureau : vos données en local, votre propre bibliothèque, un format ouvert et l'import de vos documents existants. Pas d'abonnement au cloud pour accéder à votre travail." },
    ];
    return {
      faqs: faqData.map((f, i) => ({
        q: f.q,
        a: f.a,
        open: this.state.openFaq === i,
        caret: this.state.openFaq === i ? 'rotate(135deg)' : 'rotate(0deg)',
        onToggle: () => this.toggleFaq(i),
      })),
    };
  }
}
</script>
</body>
</html>
