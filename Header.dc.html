<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/r-dibat-design-system-740ba38c-581d-4335-88dd-fcf28913eed8/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/r-dibat-design-system-740ba38c-581d-4335-88dd-fcf28913eed8/tokens/colors.css">
  <link rel="stylesheet" href="_ds/r-dibat-design-system-740ba38c-581d-4335-88dd-fcf28913eed8/tokens/typography.css">
  <link rel="stylesheet" href="_ds/r-dibat-design-system-740ba38c-581d-4335-88dd-fcf28913eed8/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/r-dibat-design-system-740ba38c-581d-4335-88dd-fcf28913eed8/styles.css">
  <script src="_ds/r-dibat-design-system-740ba38c-581d-4335-88dd-fcf28913eed8/_ds_bundle.js"></script>
</helmet>

<div style="position: relative; background: rgba(255,255,255,0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--a-border-soft); font-family: 'Hanken Grotesk', system-ui, sans-serif;">
  <header style="max-width: 1200px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; gap: 32px;">

    <a href="Landing.dc.html" style="display: inline-flex; align-items: center; text-decoration: none; flex: none;">
      <img src="uploads/redibat-lockup-h.png" alt="Rédibat" style="height: 38px; width: auto; display: block;">
    </a>

    <nav style="display: flex; align-items: center; gap: 6px; white-space: nowrap;">

      <div onMouseEnter="{{ openMenu }}" onMouseLeave="{{ closeMenu }}" style="position: relative;">
        <button type="button" onClick="{{ toggleMenu }}" style="display: inline-flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer;
                    font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; font-weight: 500; color: #1f3a5c;
                    padding: 9px 14px; border-radius: 8px; transition: background .18s ease;" style-hover="background: rgba(31,58,92,0.05);">
          Produits
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transition: transform .2s ease; transform: {{ caretTransform }};">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div style="position: absolute; top: 100%; left: 0; z-index: 30; padding-top: 8px; display: {{ menuDisplay }};">
          <div style="min-width: 210px; background: #ffffff; border: 1px solid var(--a-border); border-radius: 14px;
                    box-shadow: 0 18px 44px -18px rgba(31,58,92,0.28), 0 2px 8px rgba(31,58,92,0.06);
                    padding: 8px; opacity: {{ menuOpacity }}; transform: translateY({{ menuShift }}); transition: opacity .18s ease, transform .18s ease;">
          <sc-for list="{{ products }}" as="p" hint-placeholder-count="5">
            <a href="{{ p.href }}" style="display: block; text-decoration: none; padding: 10px 14px; border-radius: 9px;
                        font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; font-weight: 500; color: #1f3a5c;
                        transition: background .15s ease;" style-hover="background: var(--a-sel);">{{ p.name }}</a>
          </sc-for>
          </div>
        </div>
      </div>

      <a href="APropos.dc.html" style="font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; font-weight: 500; color: #1f3a5c;
               text-decoration: none; padding: 9px 14px; border-radius: 8px; transition: background .18s ease;" style-hover="background: rgba(31,58,92,0.05);">À propos</a>

      <a href="FAQ.dc.html" style="font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; font-weight: 500; color: #1f3a5c;
               text-decoration: none; padding: 9px 14px; border-radius: 8px; transition: background .18s ease;" style-hover="background: rgba(31,58,92,0.05);">FAQ</a>

      <a href="EspaceClient.dc.html" style="margin-left: 10px; display: inline-flex; align-items: center; text-decoration: none;
               font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #ffffff;
               background: linear-gradient(135deg, #0b317c 0%, #185fcb 55%, #30c5ec 100%);
               padding: 11px 22px; border-radius: 100px;
               box-shadow: 0 8px 22px -8px rgba(24,95,203,0.55); transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;" style-hover="transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 12px 30px -8px rgba(24,95,203,0.7);">Espace client</a>

    </nav>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: false };
  openMenu = () => { clearTimeout(this._mt); this.setState({ open: true }); };
  closeMenu = () => { clearTimeout(this._mt); this._mt = setTimeout(() => this.setState({ open: false }), 180); };
  toggleMenu = () => { clearTimeout(this._mt); this.setState(s => ({ open: !s.open })); };
  renderVals() {
    const open = this.state.open;
    return {
      openMenu: this.openMenu,
      closeMenu: this.closeMenu,
      toggleMenu: this.toggleMenu,
      menuDisplay: open ? 'block' : 'none',
      menuOpacity: open ? 1 : 0,
      menuShift: open ? '0' : '-6px',
      caretTransform: open ? 'rotate(180deg)' : 'rotate(0deg)',
      products: [
        { name: 'CCTP', href: 'CCTP.dc.html' },
        { name: 'DPGF', href: 'DPGF.dc.html' },
        { name: 'Ouverture des plis', href: 'OuvertureDesPlis.dc.html' },
        { name: 'TCO', href: 'TCO.dc.html' },
        { name: 'RAO', href: 'RAO.dc.html' },
      ],
    };
  }
}
</script>
</body>
</html>
